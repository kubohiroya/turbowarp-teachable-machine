name: Release

# The family's standard release: a pushed v<version> tag is checked, packed, attached to the
# GitHub Release and published to npm through trusted publishing (OIDC). No npm token is stored.
#
# npmjs.com side (package Settings -> Trusted publisher) must name:
#   Organization or user  kubohiroya
#   Repository            turbowarp-teachable-machine
#   Workflow filename     release.yml   <- the filename alone
#   Environment           (empty)
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
        # No registry-url: it writes an .npmrc with a placeholder token, and npm sends a configured
        # token instead of exchanging the workflow identity, so publishing fails with
        # "OIDC permission denied".
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - name: Check the tag names the package version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not name package.json version $version."
            exit 1
          fi
      - name: Pack the npm archive
        id: pack
        run: |
          mkdir -p "$RUNNER_TEMP/npm"
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP/npm" > "$RUNNER_TEMP/pack.json"
          file="$(node -p "const r = require(process.env.RUNNER_TEMP + '/pack.json'); (Array.isArray(r) ? r[0] : Object.values(r)[0]).filename")"
          echo "file=$RUNNER_TEMP/npm/$file" >> "$GITHUB_OUTPUT"
      - name: Create ZIP archive
        run: |
          cd dist
          zip -r ../turbowarp-teachable-machine.zip .
      - name: Attach to the GitHub Release
        # An attachment that already exists must be byte-identical: a release driver may have
        # uploaded its locally verified archive first, and a differing CI build stops here,
        # before anything reaches npm.
        env:
          GH_TOKEN: ${{ github.token }}
          NPM_ARCHIVE: ${{ steps.pack.outputs.file }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if ! gh release view "$tag" > /dev/null 2>&1; then
            prerelease=()
            case "$version" in *-*) prerelease=(--prerelease) ;; esac
            gh release create "$tag" --verify-tag --title "$name $version" --generate-notes "${prerelease[@]}" ||
              gh release view "$tag" > /dev/null
          fi
          existing="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '.assets[] | "\(.name)\t\(.digest)"')"
          shopt -s nullglob
          for file in "$NPM_ARCHIVE" \
            dist/teachable-machine.js \
            dist/teachable-machine-webgpu.js \
            dist/teachable-machine-wasm.js \
            dist/composition.js \
            dist/runtime.js \
            dist/backend-wasm.js \
            dist/backend-webgpu.js \
            dist/wasm/tfjs-backend-wasm.wasm \
            dist/wasm/tfjs-backend-wasm-simd.wasm \
            dist/wasm/tfjs-backend-wasm-threaded-simd.wasm \
            dist/wasm/tfjs-backend-wasm-threaded-simd.worker.js \
            dist/posenet.js \
            dist/posenet/mobilenet-v1-075-stride16/model-stride16.json \
            dist/posenet/mobilenet-v1-075-stride16/group1-shard1of2.bin \
            dist/posenet/mobilenet-v1-075-stride16/group1-shard2of2.bin \
            dist/THIRD_PARTY_NOTICES.md \
            turbowarp-teachable-machine.zip; do
            want="sha256:$(sha256sum "$file" | cut -d' ' -f1)"
            have="$(printf '%s\n' "$existing" | awk -F'\t' -v n="$(basename "$file")" '$1 == n { print $2 }')"
            if [ -z "$have" ]; then
              gh release upload "$tag" "$file"
            elif [ "$have" != "$want" ]; then
              echo "::error::$(basename "$file") is already attached with different content."
              exit 1
            fi
          done
      - name: Use an npm that supports trusted publishing
        run: npm install --global npm@11.21.0
      - name: Publish to npm
        # Last step: a failed check or mismatched tag stops the release before the registry,
        # where a version cannot be replaced.
        env:
          NPM_ARCHIVE: ${{ steps.pack.outputs.file }}
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          want="$(sha1sum "$NPM_ARCHIVE" | cut -d' ' -f1)"
          have="$(npm view "$name@$version" dist.shasum --prefer-online 2> /dev/null || true)"
          if [ -n "$have" ]; then
            if [ "$have" != "$want" ]; then
              echo "::error::$name@$version is already published with different content."
              exit 1
            fi
            echo "$name@$version is already published with this archive."
          else
            dist_tag="$(node -p "require('./package.json').publishConfig?.tag ?? ''")"
            if [ -z "$dist_tag" ]; then
              case "$version" in *-*) dist_tag=next ;; *) dist_tag=latest ;; esac
            fi
            npm publish "$NPM_ARCHIVE" --access public --provenance --tag "$dist_tag"
          fi
          # Accepting a publish and serving it differ; wait for the registry itself.
          for attempt in $(seq 1 60); do
            have="$(npm view "$name@$version" dist.shasum --prefer-online 2> /dev/null || true)"
            [ -n "$have" ] && break
            sleep 10
          done
          if [ "$have" != "$want" ]; then
            echo "::error::The registry does not serve $name@$version with the packed archive."
            exit 1
          fi
      - name: Point latest and next at this release
        # The family keeps both dist-tags on the newest verified release
        # (kubohiroya/turbowarp-plus-packages#16).
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          for tag in latest next; do
            if [ "$(npm view "$name" "dist-tags.$tag" --prefer-online 2> /dev/null || true)" != "$version" ]; then
              npm dist-tag add "$name@$version" "$tag"
            fi
          done

  finish-existing-release:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'kubohiroya/turbowarp-teachable-machine' && github.ref == 'refs/heads/codex/release/teachable-machine-4.1.0-tag-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '26.12.1'
      - name: Verify the immutable published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          const repository = 'kubohiroya/turbowarp-teachable-machine';
          const name = '@kubohiroya/turbowarp-teachable-machine', version = '4.1.0';
          const commit = 'd16fda0f4bd6f8307d18aee1f46aa3623a8b64df';
          const sha1 = 'e3bad2def7c018c88604ca7c7049744d71d0827c';
          const sha256 = '5d592ba92d3340ea4d96ec4c50e7d07b7d0fe8eb42b2c94bca6f1cf5f38721b5';
          const api = path => JSON.parse(execFileSync('gh', ['api', '--method', 'GET', `repos/${repository}/${path}`], {encoding:'utf8'}));
          const get = async url => {const r=await fetch(url);assert.equal(r.status,200);return r;};
          const tag = api('git/ref/tags/v4.1.0').object;
          assert.equal(tag.type === 'tag' ? api(`git/tags/${tag.sha}`).object.sha : tag.sha, commit);
          assert.equal(api('git/ref/heads/main').object.sha, commit);
          const manifestFile = api(`contents/package.json?ref=${commit}`);
          const manifest = JSON.parse(Buffer.from(manifestFile.content,'base64').toString());
          assert.equal(manifest.name,name);assert.equal(manifest.version,version);
          const author={name:'Hiroya Kubo',email:'hiroya@cuc.ac.jp',url:'https://github.com/kubohiroya'};
          assert.deepEqual(manifest.author,author);
          const published=await (await get(`https://registry.npmjs.org/${encodeURIComponent(name)}/${version}`)).json();
          assert.equal(published.name,name);assert.equal(published.version,version);assert.deepEqual(published.author,author);
          assert.equal(published.dist.shasum,sha1);
          assert.equal(published.dist.attestations?.provenance?.predicateType,'https://slsa.dev/provenance/v1');
          assert.equal(new URL(published.dist.tarball).origin,'https://registry.npmjs.org');
          const bytes=Buffer.from(await (await get(published.dist.tarball)).arrayBuffer());
          assert.equal(createHash('sha1').update(bytes).digest('hex'),sha1);
          assert.equal(createHash('sha256').update(bytes).digest('hex'),sha256);
          assert.equal('sha512-'+createHash('sha512').update(bytes).digest('base64'),published.dist.integrity);
          const release=api('releases/tags/v4.1.0');assert.equal(release.draft,false);assert.equal(release.tag_name,'v4.1.0');
          const asset=release.assets.find(a=>a.name==='kubohiroya-turbowarp-teachable-machine-4.1.0.tgz');
          assert(asset);assert.equal(asset.digest,'sha256:'+sha256);assert.equal(asset.size,bytes.length);
          const tags=(await (await get(`https://registry.npmjs.org/${encodeURIComponent(name)}`)).json())['dist-tags'];
          assert.equal(tags.latest,version);assert(['4.0.2',version].includes(tags.next));
          console.log(JSON.stringify({repository,name,version,commit,sha1,sha256,archiveBytes:bytes.length,distTagsBefore:tags,operation:'sync-existing-version-tags-only'}));
          JS
      - name: Use npm with OIDC dist-tag support
        run: npm install --global npm@11.21.0
      - name: Synchronize the existing version tags through trusted publishing
        run: |
          set -euo pipefail
          test "$(npm --version)" = 11.21.0
          name='@kubohiroya/turbowarp-teachable-machine'
          version='4.1.0'
          test "$(npm view "$name@$version" dist.shasum --prefer-online)" = 'e3bad2def7c018c88604ca7c7049744d71d0827c'
          test "$(npm view "$name" dist-tags.latest --prefer-online)" = "$version"
          current="$(npm view "$name" dist-tags.next --prefer-online)"
          case "$current" in 4.0.2|4.1.0) ;; *) exit 1 ;; esac
          if [ "$current" != "$version" ]; then
            npm dist-tag add "$name@$version" next --registry=https://registry.npmjs.org
          fi
          for attempt in $(seq 1 30); do
            latest="$(npm view "$name" dist-tags.latest --prefer-online)"
            next="$(npm view "$name" dist-tags.next --prefer-online)"
            if [ "$latest" = "$version" ] && [ "$next" = "$version" ]; then
              exit 0
            fi
            sleep 5
          done
          exit 1
